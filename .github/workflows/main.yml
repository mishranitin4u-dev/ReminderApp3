name: Build Daily Reminder APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter and Java
        run: |
          flutter --version
          java -version

      - name: Generate Android project scaffolding and restore app files
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/daily-reminder-backup/raw"
          cp android/app/src/main/AndroidManifest.xml "$RUNNER_TEMP/daily-reminder-backup/AndroidManifest.xml"
          cp android/app/src/main/res/raw/*.wav "$RUNNER_TEMP/daily-reminder-backup/raw/"
          flutter create --platforms=android --project-name daily_reminder .
          mkdir -p android/app/src/main/res/raw
          cp "$RUNNER_TEMP/daily-reminder-backup/AndroidManifest.xml" android/app/src/main/AndroidManifest.xml
          cp "$RUNNER_TEMP/daily-reminder-backup/raw/"*.wav android/app/src/main/res/raw/

      - name: Enable and verify Android core library desugaring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          candidates = [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]
          gradle_file = next((p for p in candidates if p.exists()), None)
          if gradle_file is None:
              raise SystemExit("ERROR: Android app Gradle file not found")

          text = gradle_file.read_text()
          is_kotlin = gradle_file.suffix == ".kts"
          flag = "isCoreLibraryDesugaringEnabled = true" if is_kotlin else "coreLibraryDesugaringEnabled true"
          dependency = ('coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
                        if is_kotlin else
                        "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'")

          # Insert the flag inside the existing compileOptions block, or create one
          # inside the android block if the generated template does not have it.
          if flag not in text:
              match = re.search(r"compileOptions\s*\{", text)
              if match:
                  insert_at = match.end()
                  text = text[:insert_at] + "\n        " + flag + text[insert_at:]
              else:
                  android_match = re.search(r"android\s*\{", text)
                  if not android_match:
                      raise SystemExit("ERROR: android block not found in " + str(gradle_file))
                  insert_at = android_match.end()
                  text = text[:insert_at] + "\n    compileOptions {\n        " + flag + "\n    }\n" + text[insert_at:]

          # Add the dependency to an existing dependencies block or create one.
          if dependency not in text:
              dep_match = re.search(r"dependencies\s*\{", text)
              if dep_match:
                  insert_at = dep_match.end()
                  text = text[:insert_at] + "\n    " + dependency + text[insert_at:]
              else:
                  text = text.rstrip() + "\n\ndependencies {\n    " + dependency + "\n}\n"

          gradle_file.write_text(text)
          check = gradle_file.read_text()
          if flag not in check or dependency not in check:
              raise SystemExit("ERROR: Desugaring settings could not be verified")
          print("SUCCESS: Desugaring enabled in", gradle_file)
          print("SUCCESS: Dependency added:", dependency)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Confirm APK exists
        run: test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Daily-Reminder-V2.2-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
